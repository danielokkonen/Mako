name: mako

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mako
    ports:
      - "5433:5432"
    volumes:
      - mako-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mako"]
      interval: 5s
      timeout: 3s
      retries: 10

  quotes-toscrape:
    build:
      context: .
      dockerfile: src/Mako.Host/Dockerfile
    image: mako-host
    command: ["configs/quotes.yaml", "--schedule", "0 */6 * * *"] # every 6h on the hour
    environment:
      TZ: ${MAKO_TZ:-UTC}
      MAKO_CONNECTION_STRING: Host=db;Port=5432;Username=user;Password=password;Database=mako
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  blocket:
    image: mako-host
    command: ["configs/blocket.yaml", "--schedule", "0 6 * * *"] # daily at 06:00
    environment:
      TZ: ${MAKO_TZ:-UTC}
      MAKO_CONNECTION_STRING: Host=db;Port=5432;Username=user;Password=password;Database=mako
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mako-db:
