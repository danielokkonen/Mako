services:
  db:
    image: postgres:18
    container_name: dev-db-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scraper
    ports:
      - "5432:5432"
    volumes:
      - dev-db:/var/home/daniel/.local/share/containers/storage/volumes/dev-db/_data

volumes:
  dev-db:
